name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          check-latest: true

      - name: Lint
        run: go vet ./...

      - name: Build
        run: go build -o model-arena .

      - name: Test
        run: go test -v -count=1 ./...

  goreleaser:
    needs: lint-build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/model-arena-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -o dist/model-arena-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o dist/model-arena-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o dist/model-arena-windows-amd64.exe .
          cd dist
          for f in *; do tar czf "$f.tar.gz" "$f"; done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*.tar.gz
